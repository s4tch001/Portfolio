# Deployed via Netlify's Next.js runtime. Pages render per request so Next.js
# can attach a fresh CSP nonce; /api/contact runs as a Netlify Function.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Shared hardening headers. The request-specific Content-Security-Policy is
# generated by proxy.ts so Netlify must not add a second static CSP header.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://www.pauuu.dev/*"
  to = "https://pauuu.dev/:splat"
  status = 301
  force = true
