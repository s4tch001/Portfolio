# Deployed via Netlify's Next.js runtime. Pages are statically prerendered;
# /api/contact runs as a Netlify Function.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Shared hardening headers, including the static Content-Security-Policy.
[[headers]]
  for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep HTML uncacheable while preventing intermediary HTML rewriting. In
# particular, Cloudflare Web Analytics honors `no-transform`, so its beacon
# and /cdn-cgi/rum request stay out of the critical dependency chain even when
# the orange-cloud proxy remains enabled.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-transform"

[[headers]]
  for = "/contact"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-transform"

[[redirects]]
  from = "https://www.pauuu.dev/*"
  to = "https://pauuu.dev/:splat"
  status = 301
  force = true
